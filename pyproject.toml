[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ineedtosendafax"
version = "1.0.0"
description = "Official Python client for the INeedToSendAFax API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "INeedToSendAFax" }]
keywords = ["fax", "api", "sdk", "t38"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://api.ineedtosendafax.com"
Documentation = "https://api.ineedtosendafax.com/docs"
Repository = "https://github.com/INeedToSendAFax/sdk-python"

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/ineedtosendafax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
